<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Posivo — Dashboard POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#1D1B1A;
    --red:#E63946;
    --orange:#FF8A00;
    --white:#FFFFFF;
    --bg:#F6F3EF;
    --surface:#FFFFFF;
    --border:#E8E3DC;
    --muted:#8C857C;
    --muted-2:#B7AFA5;
    --grad: linear-gradient(135deg, var(--red) 0%, var(--orange) 100%);
    --good:#1E8E5A;
    --good-bg:#E7F5EE;
    --warn:#B5790A;
    --warn-bg:#FDF0DA;
    --bad-bg:#FBE8E7;
    --shadow: 0 1px 2px rgba(13,13,13,0.04), 0 8px 24px -12px rgba(13,13,13,0.10);
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Sora','Inter',sans-serif;}
  .font-mono{font-family:'JetBrains Mono',Consolas,monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DAD3C8;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  *:focus-visible{outline:2px solid var(--orange); outline-offset:2px; border-radius:6px;}

  .app-shell{display:flex; height:100vh; overflow:hidden;}

  .sidebar{
    width:76px; flex-shrink:0; background:var(--ink);
    display:flex; flex-direction:column;
    padding:22px 16px 18px;
    transition:width .28s cubic-bezier(.4,0,.2,1);
    position:relative; z-index:40;
  }
  .sidebar:hover, .sidebar.pinned{width:250px;}
  .sidebar-label{
    opacity:0; max-width:0; overflow:hidden; white-space:nowrap;
    transition:opacity .16s ease, max-width .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar:hover .sidebar-label, .sidebar.pinned .sidebar-label{opacity:1; max-width:220px; transition:opacity .22s ease .08s, max-width .28s cubic-bezier(.4,0,.2,1);}
  .sidebar-toggle{
    position:absolute; top:20px; right:-13px; width:26px; height:26px; border-radius:50%;
    background:var(--ink); border:1px solid #2A2724; color:#B4AEA6; display:flex;
    align-items:center; justify-content:center; cursor:pointer; z-index:50; padding:0;
    transition:background .15s, color .15s, border-color .15s;
  }
  .sidebar-toggle:hover{background:#1B1A18; color:#fff; border-color:#3A3733;}
  .sidebar-toggle svg{transition:transform .25s ease;}
  .sidebar.pinned .sidebar-toggle svg{transform:rotate(180deg);}
  .brand-row{display:flex; align-items:center; gap:10px; padding:0 6px 22px; transition:gap .2s, justify-content .2s;}
  .sidebar:not(:hover):not(.pinned) .brand-row{gap:0; justify-content:center; padding-left:0; padding-right:0;}
  .brand-logo-img{height:36px; width:auto; flex-shrink:0; display:block;}
  .brand-word{color:var(--white); font-weight:700; font-size:19px; letter-spacing:-0.01em; font-family:'Sora','Inter',sans-serif; line-height:1.1;}
  .brand-word .accent{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand-tagline{color:#9A948B; font-size:10.5px; font-weight:500; line-height:1.35; margin-top:2px;}
  .nav-section-label{color:#6B6560; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase; padding:14px 10px 6px; font-weight:600; white-space:nowrap; overflow:hidden; transition:opacity .16s ease, padding .28s ease, margin .28s ease;}
  .sidebar:not(:hover):not(.pinned) .nav-section-label{opacity:0; padding-top:0; padding-bottom:0; margin:10px 0;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px; border:none; background:transparent;
    color:#B4AEA6; font-size:13.5px; font-weight:500; width:100%; text-align:left;
    position:relative; z-index:1; transition:background .15s, color .15s, justify-content .2s, padding .2s;
  }
  .sidebar:not(:hover):not(.pinned) .nav-item{justify-content:center; padding:10px 0; gap:0;}
  .nav-item svg{flex-shrink:0; opacity:0.85;}
  .nav-item:hover{color:var(--white);}
  .nav-item.active{background:#1B1A18; color:var(--white);}
  .nav-item.active::before{
    content:''; position:absolute; left:-16px; top:8px; bottom:8px; width:3px;
    border-radius:0 4px 4px 0; background:var(--grad);
  }
  /* Single highlight bar that glides smoothly between menu items on hover (see JS) */
  .nav-highlight{
    position:absolute; left:0; top:0; width:0; height:0; z-index:0; border-radius:10px;
    pointer-events:none; opacity:0; border:1.5px solid transparent;
    background:var(--ink-soft) padding-box, linear-gradient(135deg, var(--red), var(--orange)) border-box;
    box-shadow:0 0 14px -3px rgba(230,57,70,0.5);
    transition:top .22s cubic-bezier(.4,0,.2,1), left .22s cubic-bezier(.4,0,.2,1),
               width .22s cubic-bezier(.4,0,.2,1), height .22s cubic-bezier(.4,0,.2,1),
               opacity .16s ease;
  }
  .nav-highlight.is-visible{opacity:1;}
  @media (prefers-reduced-motion: reduce){ .nav-highlight{transition:opacity .16s ease;} }
  .sidebar-bottom{margin-top:auto; padding-top:14px; border-top:1px solid #221F1C;}
  .outlet-pill{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:11px;
    background:#161412; border:1px solid #262320; transition:justify-content .2s, padding .2s;
  }
  .sidebar:not(:hover):not(.pinned) .outlet-pill{justify-content:center; padding:9px 0; gap:0;}
  .sidebar:not(:hover):not(.pinned) .outlet-pill [data-logout]{display:none;}
  .outlet-avatar{
    width:30px; height:30px; border-radius:8px; background:var(--grad);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px;
    flex-shrink:0;
  }

  .topbar{
    height:64px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 26px;
  }
  .page-title{font-family:'Sora','Inter',sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em;}
  .page-sub{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .badge-time{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);
    background:#F1EDE6; padding:6px 11px; border-radius:8px; border:1px solid var(--border);
  }

  .content-scroll{flex:1; overflow-y:auto;}
  .content-pad{padding:24px 26px 40px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);}
  .auth-card{background-image:url('login-bg.png'); background-size:cover; background-position:center; border:1px solid rgba(255,255,255,0.08); border-radius:16px; box-shadow:var(--shadow); color:#F5F1EA;}
  .auth-card input{background:#fff; color:var(--ink);}
  .auth-card input::placeholder{color:#9a948b;}
  .stat-card{padding:18px 18px 16px;}
  .stat-label{font-size:12.5px; color:var(--muted); font-weight:500;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:23px; font-weight:700; margin-top:8px; letter-spacing:-0.01em;}
  .stat-delta{font-size:12px; font-weight:600; margin-top:7px; display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:6px;}
  .stat-delta.up{color:var(--good); background:var(--good-bg);}
  .stat-delta.down{color:var(--red); background:var(--bad-bg);}
  .stat-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;}

  .section-title{font-family:'Sora','Inter',sans-serif; font-weight:700; font-size:15px;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:13px;
    padding:9px 15px; border-radius:10px; border:1px solid transparent; transition:transform .1s, box-shadow .15s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--grad); color:#fff; box-shadow:0 6px 16px -6px rgba(230,57,70,0.5);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-dark{background:var(--ink); color:#fff;}
  .btn-outline{background:#fff; color:var(--ink); border-color:var(--border);}
  .btn-outline:hover{border-color:var(--muted-2);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted);
    font-weight:600; padding:0 14px 10px; border-bottom:1px solid var(--border);
  }
  tbody td{padding:13px 14px; font-size:13.5px; border-bottom:1px solid #F1EEE9;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFAF8;}

  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .pill-dot{width:6px;height:6px;border-radius:50%; background:currentColor; display:inline-block;}
  .pill-good{background:var(--good-bg); color:var(--good);}
  .pill-warn{background:var(--warn-bg); color:var(--warn);}
  .pill-bad{background:var(--bad-bg); color:var(--red);}
  .pill-neutral{background:#EEEBE5; color:var(--muted);}

  .row-between{display:flex; align-items:center; justify-content:space-between;}

  .pos-layout{display:flex; gap:20px; height:calc(100vh - 64px - 48px);}
  .pos-products{flex:1; display:flex; flex-direction:column; min-width:0;}
  .cat-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .cat-tab{
    padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--border);
    background:#fff; color:var(--ink); transition:.15s;
  }
  .cat-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px; overflow-y:auto; padding-bottom:10px; align-content:start;}
  .product-card{
    background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px; text-align:left; transition:.15s;
    display:flex; flex-direction:column; gap:8px; width:100%;
  }
  .product-card:hover{border-color:var(--orange); box-shadow:0 6px 18px -10px rgba(255,138,0,0.4); transform:translateY(-1px);}
  .product-thumb{
    width:100%; aspect-ratio:1.3/1; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:'Sora','Inter',sans-serif; font-weight:700; font-size:15px; color:#fff;
  }
  .product-name{font-size:13px; font-weight:600; line-height:1.25;}
  .product-price{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); font-weight:600;}

  .cart-panel{
    width:340px; flex-shrink:0; background:#fff; border:1px solid var(--border); border-radius:16px;
    display:flex; flex-direction:column; box-shadow:var(--shadow);
  }
  .cart-header{padding:16px 18px 12px; border-bottom:1px solid var(--border);}
  .cart-items{flex:1; overflow-y:auto; padding:10px 14px;}
  .cart-item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid #F3F0EB;}
  .cart-item:last-child{border-bottom:none;}
  .qty-btn{width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; line-height:1; padding:0;}
  .qty-btn:hover{background:#F6F3EF;}
  .cart-footer{padding:14px 18px 18px; border-top:1px solid var(--border);}
  .pay-methods{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;}
  .pay-btn{
    border:1px solid var(--border); background:#fff; border-radius:10px; padding:9px 6px; font-size:12px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--ink);
  }
  .pay-btn.active{border-color:var(--orange); background:#FFF6EC; box-shadow:inset 0 0 0 1px var(--orange);}

  .table-legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
  .legend-item{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); font-weight:500;}
  .legend-dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .meja-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px;}
  .meja-card{border-radius:16px; padding:16px 14px; cursor:pointer; transition:.15s; border:1.5px solid transparent; position:relative;}
  .meja-card:hover{transform:translateY(-2px);}
  .meja-kosong{background:#E8F5EC; border-color:#9FD8AE;}
  .meja-terisi{background:#FBEDEC; border-color:#F3C6C4;}
  .meja-kotor{background:#FDF3E2; border-color:#F2DBA6;}
  .meja-reserved{background:#F2EFEA; border-color:var(--muted-2); border-style:dashed;}
  .meja-number{font-family:'Sora','Inter',sans-serif; font-weight:800; font-size:21px;}
  .meja-cap{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .search-bar{
    display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; width:280px;
  }
  .search-bar input{border:none; outline:none; font-size:13px; width:100%; background:transparent;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(13,13,13,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-card{background:#fff; border-radius:18px; width:380px; max-width:100%; padding:22px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.35);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);
    display:flex; align-items:center; gap:9px; z-index:60;
  }

  @media (max-width: 880px){
    .pos-layout{flex-direction:column; height:auto;}
    .cart-panel{width:100%;}
  }
</style>
</head>

function pad2(n){ return String(n).length<2 ? "0"+n : String(n); }
function localISODate(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function localISOMonth(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function initials(name){ return String(name||"?").split(" ").map(function(w){return w[0];}).slice(0,2).join(""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function colorFor(id){ return THUMB_COLORS[Number(id)%THUMB_COLORS.length] || "#8B5E34"; }

/* ---------- Printer Bluetooth (Web Bluetooth, ESC/POS) ---------- */
var PRINTER_SERVICE_CANDIDATES = [
  "000018f0-0000-1000-8000-00805f9b34fb",
  "0000ff00-0000-1000-8000-00805f9b34fb",
  "0000ffe0-0000-1000-8000-00805f9b34fb",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455",
  "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
];

function asciiSafe(s){
  return String(s==null?"":s).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x00-\x7E]/g,"?");
}
function padRight(s,len){ s=asciiSafe(s); return s.length>=len ? s.slice(0,len) : s+" ".repeat(len-s.length); }
function padLeft(s,len){ s=asciiSafe(s); return s.length>=len ? s.slice(-len) : " ".repeat(len-s.length)+s; }
function centerLine(s,len){ s=asciiSafe(s); if(s.length>=len) return s.slice(0,len); var total=len-s.length, left=Math.floor(total/2); return " ".repeat(left)+s+" ".repeat(total-left); }
function moneyShort(n){ return Number(n||0).toLocaleString("id-ID"); }

async function connectPrinter(){
  if(!navigator.bluetooth){
    state.printer.error = "Browser ini tidak mendukung Web Bluetooth. Gunakan Chrome/Edge di Android atau Desktop (bukan iOS Safari).";
    renderApp(); return;
  }
  state.printer.busy = true; state.printer.error = null; renderApp();
  try{
    var device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: PRINTER_SERVICE_CANDIDATES
    });
    var server = await device.gatt.connect();
    var services = await server.getPrimaryServices();
    var writable = null;
    for(var s=0; s<services.length && !writable; s++){
      var chars = await services[s].getCharacteristics();
      for(var c=0; c<chars.length; c++){
        var props = chars[c].properties;
        if(props && (props.write || props.writeWithoutResponse)){ writable = chars[c]; break; }
      }
    }
    if(!writable){ throw new Error("Tidak menemukan fitur cetak (characteristic) di perangkat ini."); }

    device.addEventListener("gattserverdisconnected", function(){
      state.printer.connected = false;
      state.printer.device = null;
      state.printer.characteristic = null;
      renderApp();
    });

    state.printer.device = device;
    state.printer.characteristic = writable;
    state.printer.name = device.name || "Printer Bluetooth";
    state.printer.connected = true;
  }catch(err){
    state.printer.error = "Gagal terhubung: " + (err && err.message ? err.message : err);
  }
  state.printer.busy = false;
  renderApp();
}

function disconnectPrinter(){
  try{
    if(state.printer.device && state.printer.device.gatt && state.printer.device.gatt.connected){
      state.printer.device.gatt.disconnect();
    }
  }catch(_e){}
  state.printer.connected = false;
  state.printer.device = null;
  state.printer.characteristic = null;
  renderApp();
}

async function sendToPrinter(bytes){
  var chr = state.printer.characteristic;
  if(!chr){ throw new Error("Printer belum terhubung. Sambungkan lewat menu Pengaturan."); }
  var chunkSize = 20;
  for(var i=0; i<bytes.length; i+=chunkSize){
    var chunk = bytes.slice(i, i+chunkSize);
    if(chr.writeValueWithoutResponse){ await chr.writeValueWithoutResponse(chunk); }
    else { await chr.writeValue(chunk); }
    await new Promise(function(res){ setTimeout(res, 25); });
  }
}

function getReceiptSettings(){

  return {

function loadImageElement(url){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function(){ resolve(img); };
    img.onerror = function(err){ reject(err); };
    img.src = url;
  });
}

function buildImageRasterBytes(img, maxWidthDots){
  var srcW = img.naturalWidth || img.width;
  var srcH = img.naturalHeight || img.height;
  var scale = Math.min(1, maxWidthDots / srcW);
  var w = Math.max(1, Math.round(srcW * scale));
  var h = Math.max(1, Math.round(srcH * scale));
  var wBytes = Math.ceil(w / 8);
  var wPadded = wBytes * 8;

  var canvas = document.createElement("canvas");
  canvas.width = wPadded; canvas.height = h;
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, wPadded, h);
  ctx.drawImage(img, 0, 0, w, h);
  var data = ctx.getImageData(0, 0, wPadded, h).data;

  var bytes = new Uint8Array(wBytes * h);
  for(var y=0; y<h; y++){
    for(var xb=0; xb<wBytes; xb++){
      var byte = 0;
      for(var bit=0; bit<8; bit++){
        var x = xb*8 + bit;
        var idx = (y*wPadded + x) * 4;
        var gray = data[idx]*0.3 + data[idx+1]*0.59 + data[idx+2]*0.11;
        var isBlack = data[idx+3] > 10 && gray < 160;
        if(isBlack){ byte |= (0x80 >> bit); }
      }
      bytes[y*wBytes + xb] = byte;
    }
  }

  var xL = wBytes & 0xFF, xH = (wBytes>>8) & 0xFF;
  var yL = h & 0xFF, yH = (h>>8) & 0xFF;
  var header = new Uint8Array([0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH]); // GS v 0 (raster bit image)
  var out = new Uint8Array(header.length + bytes.length);
  out.set(header, 0); out.set(bytes, header.length);
  return out;
}

async function buildReceiptBytes(items, meta){
  var W = state.printer.paperWidth || 32;
  var dotsWidth = W * 12; // ~12 dot per karakter monospace, cocok untuk 384/576 dot umum
  var rs = getReceiptSettings();
  var parts = [ new Uint8Array([0x1B, 0x40]) ]; // ESC @ init

  if(rs.logoUrl){
    try{
      var img = await loadImageElement(rs.logoUrl);
      parts.push(buildImageRasterBytes(img, dotsWidth));
      parts.push(new TextEncoder().encode("\n"));
    }catch(_e){ /* logo gagal dimuat/cetak — lanjut tanpa logo */ }
  }

  var lines = [];
  if(!rs.logoUrl){ lines.push(centerLine((state.outlet && state.outlet.name) || "POSIVO", W)); }
  if(rs.headerText){
    rs.headerText.split("\n").forEach(function(l){ lines.push(centerLine(l, W)); });
  }
  lines.push("-".repeat(W));
  lines.push(padRight(new Date().toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"}), W));
  lines.push(padRight(meta.mejaLabel ? "Meja: " + meta.mejaLabel : "Take Away", W));
  if(meta.customerName){ lines.push(padRight("Pelanggan: " + asciiSafe(meta.customerName), W)); }
  lines.push("-".repeat(W));
  items.forEach(function(i){
    lines.push(asciiSafe(i.name));
    var qtyPrice = i.qty + " x " + moneyShort(i.price);
    var lineTotal = moneyShort(i.qty * i.price);
    lines.push(padRight(qtyPrice, Math.max(1, W-lineTotal.length)) + lineTotal);
  });
  lines.push("-".repeat(W));
  lines.push(padRight("Subtotal", W-moneyShort(meta.subtotal).length) + moneyShort(meta.subtotal));
  lines.push(padRight("Pajak (10%)", W-moneyShort(meta.tax).length) + moneyShort(meta.tax));
  lines.push(padRight("TOTAL", W-moneyShort(meta.total).length) + moneyShort(meta.total));
  lines.push(padRight("Metode: " + asciiSafe(meta.method||"-"), W));
  if(meta.cashReceived!=null){
    lines.push(padRight("Tunai", W-moneyShort(meta.cashReceived).length) + moneyShort(meta.cashReceived));
    lines.push(padRight("Kembalian", W-moneyShort(Math.max(meta.changeAmount||0,0)).length) + moneyShort(Math.max(meta.changeAmount||0,0)));
  }
  lines.push("-".repeat(W));
  rs.footerText.split("\n").forEach(function(l){ lines.push(centerLine(l, W)); });
  lines.push(centerLine("- Powered by Posivo -", W));
  lines.push(""); lines.push(""); lines.push("");

  parts.push(new TextEncoder().encode(lines.join("\n") + "\n"));

  var totalLen = parts.reduce(function(s,p){ return s+p.length; }, 0);
  var out = new Uint8Array(totalLen);
  var offset = 0;
  parts.forEach(function(p){ out.set(p, offset); offset += p.length; });
  return out;
}

async function testPrint(){
  try{
    await sendToPrinter(await buildReceiptBytes(
      [{ name:"Contoh Produk", qty:1, price:20000 }],
      { mejaLabel:null, method:"Tes Cetak", subtotal:20000, tax:2000, total:22000 }

}

/* ---------- Auth / boot ---------- */
async function boot(){
  var { data } = await sb.auth.getSession();
  state.session = data.session;
  if(!state.session){ state.stage = "login"; renderApp(); return; }
  await loadData();
}

sb.auth.onAuthStateChange(function(_event, session){
  state.session = session;
  if(!session){ state.stage = "login"; state.profile = null; state.outlet = null; renderApp(); }
});

async function loadData(){
  state.stage = "loading"; renderApp();
  var uid = state.session.user.id;

  var { data: profile, error: profErr } = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  if(profErr || !profile || !profile.outlet_id){
    state.stage = "no-outlet";
    state.debugInfo = "Session UID: "+uid+"\nQuery error: "+(profErr ? (profErr.message+" (code: "+profErr.code+")") : "tidak ada")+"\nProfile ditemukan: "+(profile ? JSON.stringify(profile) : "null (tidak ada baris yang cocok)");
    renderApp(); return;
  }
  state.profile = profile;

  var { data: outlet } = await sb.from("outlets").select("*").eq("id", profile.outlet_id).maybeSingle();
  state.outlet = outlet;

  if(outlet && outlet.subscription_status === "trial" && outlet.trial_ends_at){
    var trialEnd = new Date(outlet.trial_ends_at);
    if(trialEnd.getTime() < Date.now()){
      state.stage = "trial-expired"; renderApp(); return;
    }
  } else if(outlet && (outlet.subscription_status === "expired" || outlet.subscription_status === "canceled")){
    state.stage = "trial-expired"; renderApp(); return;
  }

  await refreshAll();
  subscribeRealtime();
  state.stage = "ready";
  renderApp();
}

async function refreshAll(){
  var outletId = state.profile.outlet_id;
  var [{ data: products }, { data: tables }, { data: categories }] = await Promise.all([
    sb.from("products").select("*").eq("outlet_id", outletId).order("name"),
    sb.from("tables").select("*").eq("outlet_id", outletId).order("label"),
    sb.from("categories").select("*").eq("outlet_id", outletId).order("name")
  ]);
  state.products = products || [];
  state.tables = tables || [];
  state.categories = categories || [];
  if(!state.kasir.selectedMeja && state.tables[0]) state.kasir.selectedMeja = state.tables[0].id;
  await refreshDashboardStats();
}

async function refreshDashboardStats(){
  var outletId = state.profile.outlet_id;
  var todayStart = new Date(); todayStart.setHours(0,0,0,0);
  var [{ data: todayOrders }, { data: recent }] = await Promise.all([
    sb.from("orders").select("total,status").eq("outlet_id", outletId).eq("status","selesai").gte("created_at", todayStart.toISOString()),
    sb.from("orders").select("id,total,status,created_at,payments(method)").eq("outlet_id", outletId).order("created_at",{ascending:false}).limit(5)
  ]);
  state.todaySales = (todayOrders||[]).reduce(function(s,o){ return s+Number(o.total||0); }, 0);
  state.todayTransCount = (todayOrders||[]).length;
  state.recentOrders = recent || [];
}

function subscribeRealtime(){
  var outletId = state.profile.outlet_id;
  sb.channel("tables-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"tables", filter:"outlet_id=eq."+outletId }, function(){
      sb.from("tables").select("*").eq("outlet_id", outletId).order("label").then(function(res){
        state.tables = res.data || []; renderApp();
      });
    }).subscribe();

  sb.channel("products-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"products", filter:"outlet_id=eq."+outletId }, function(){
      sb.from("products").select("*").eq("outlet_id", outletId).order("name").then(function(res){
        state.products = res.data || []; renderApp();
      });
    }).subscribe();
}

async function handleLoginSubmit(e){
  e.preventDefault();
  var email = document.getElementById("login-email").value.trim();

  state.busy = true; state.authError = null; renderApp();
  var { data, error } = await sb.auth.signInWithPassword({ email:email, password:password });

  state.session = data.session;

async function handleSignupSubmit(e){
  e.preventDefault();
  var business = document.getElementById("signup-business").value.trim();

  state.busy = false;

  if(!data.session){
    // proyek mewajibkan konfirmasi email

    state.authMode = "login";
    renderApp();
    return;
  }
  state.session = data.session;
  await loadData();
}

/* ---------- Dashboard ---------- */
function chartSVG(points){
  points = (points && points.length>1) ? points : [0,0];
  var w=560, h=170, pad=10;
  var max = Math.max.apply(null, points), min = Math.min.apply(null, points);
  if(max===min){ max = min+1; }
  var step = (w-pad*2)/(points.length-1);
  var coords = points.map(function(p,i){
    var x = pad + i*step;
    var y = h - pad - ((p-min)/(max-min))*(h-pad*2);
    return [x,y];
  });
  var linePath = coords.map(function(c,i){ return (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1); }).join(" ");
  var last = coords[coords.length-1], first = coords[0];
  var areaPath = linePath + " L"+last[0]+","+(h-pad)+" L"+first[0]+","+(h-pad)+" Z";
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="180" preserveAspectRatio="none">'+
    '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF8A00" stop-opacity="0.28"/><stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/></linearGradient>'+
    '<linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E63946"/><stop offset="100%" stop-color="#FF8A00"/></linearGradient></defs>'+
    '<path d="'+areaPath+'" fill="url(#areaGrad)"/>'+
    '<path d="'+linePath+'" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4.5" fill="#fff" stroke="#E63946" stroke-width="2.5"/>'+
    '</svg>';
}

function donutSVG(data){
  data = (data && data.length>0) ? data : [{label:"Belum ada data", val:100, color:"#EEEBE5"}];
  var acc=0, r=52, cx=60, cy=60, sw=16;
  var circ = 2*Math.PI*r;
  var circles = data.map(function(d){
    var frac = d.val/100;
    var dash = frac*circ;
    var offset = circ - (acc/100)*circ;
    acc += d.val;
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
  }).join("");
  var legend = data.map(function(d){
    return '<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;"><span style="width:9px;height:9px;border-radius:3px;background:'+d.color+';display:inline-block;flex-shrink:0;"></span><span style="color:var(--muted);min-width:58px;">'+esc(d.label)+'</span><span style="font-family:JetBrains Mono,monospace;font-weight:600;">'+d.val+'%</span></div>';
  }).join("");
  return '<div style="display:flex;align-items:center;gap:18px;"><svg width="120" height="120" viewBox="0 0 120 120">'+circles+'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-sw/2-3)+'" fill="#fff"/></svg><div style="display:flex;flex-direction:column;gap:9px;">'+legend+'</div></div>';
}

async function loadDashboardPeriod(){
  if(!state.profile) return;
  var dp = state.dashboardPeriod;
  dp.loading = true; renderApp();

  var start, end;
  if(dp.filterType === "harian"){
    start = new Date(dp.date+"T00:00:00");
    end = new Date(start); end.setDate(end.getDate()+1);
  } else if(dp.filterType === "bulanan"){
    var parts = dp.month.split("-");
    start = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    end = new Date(Number(parts[0]), Number(parts[1]), 1);
  } else {
    start = new Date(Number(dp.year), 0, 1);
    end = new Date(Number(dp.year)+1, 0, 1);
  }

  var { data, error } = await sb.from("orders")
    .select("id,total,status,created_at,payments(method)")
    .eq("outlet_id", state.profile.outlet_id)
    .gte("created_at", start.toISOString())
    .lt("created_at", end.toISOString())
    .order("created_at", { ascending:true });

  dp.loading = false;
  if(error){ dp.error = error.message; renderApp(); return; }
  dp.orders = data || [];
  dp.loaded = true;
  renderApp();
}

function dashboardPeriodLabel(){
  var dp = state.dashboardPeriod;
  if(dp.filterType==="harian"){
    var isToday = dp.date === localISODate();
    return isToday ? "Hari Ini" : new Date(dp.date+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  }
  if(dp.filterType==="bulanan"){
    var parts = dp.month.split("-");
    return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  }
  return String(dp.year);
}

function dashboardSummary(){
  var dp = state.dashboardPeriod;
  var valid = dp.orders.filter(function(o){ return o.status==="selesai"; });
  var totalSales = valid.reduce(function(s,o){ return s+Number(o.total||0); }, 0);
  var transCount = valid.length;

  var byMethod = {};
  valid.forEach(function(o){
    var m = (o.payments && o.payments[0]) ? o.payments[0].method : "lainnya";
    byMethod[m] = (byMethod[m]||0) + Number(o.total||0);
  });
  var methodList = Object.keys(byMethod).map(function(m){
    var pct = totalSales>0 ? Math.round(byMethod[m]/totalSales*100) : 0;
    return { label: m.charAt(0).toUpperCase()+m.slice(1), val: pct, color: METHOD_COLORS[m]||"#B7AFA5" };
  }).sort(function(a,b){ return b.val-a.val; });

  var buckets, keys;
  if(dp.filterType==="harian"){
    buckets = {}; keys = [];
    for(var h=0; h<24; h++){ buckets[h]=0; keys.push(h); }
    valid.forEach(function(o){ var h=new Date(o.created_at).getHours(); buckets[h]+=Number(o.total||0); });
  } else if(dp.filterType==="bulanan"){
    var parts = dp.month.split("-");
    var daysInMonth = new Date(Number(parts[0]), Number(parts[1]), 0).getDate();
    buckets = {}; keys = [];
    for(var d=1; d<=daysInMonth; d++){ buckets[d]=0; keys.push(d); }
    valid.forEach(function(o){ var dd=new Date(o.created_at).getDate(); buckets[dd]+=Number(o.total||0); });
  } else {
    buckets = {}; keys = [];
    for(var m2=0; m2<12; m2++){ buckets[m2]=0; keys.push(m2); }
    valid.forEach(function(o){ var mm=new Date(o.created_at).getMonth(); buckets[mm]+=Number(o.total||0); });
  }
  var series = keys.map(function(k){ return buckets[k]; });

  return { totalSales:totalSales, transCount:transCount, methodList:methodList, series:series };
}

      ? '<span class="pill pill-good" style="font-size:10.5px;"><span class="pill-dot"></span>Printer siap</span>'
      : '<span class="pill pill-neutral" style="font-size:10.5px;">Printer belum tersambung</span>')+
    '</div></div>';
  html += '<div class="cart-items">'+cartItemsHtml+'</div>';
  html += '<div class="cart-footer">';
  html += '<div class="row-between" style="font-size:13px;color:var(--muted);margin-bottom:6px;"><span>Subtotal</span><span style="font-family:JetBrains Mono,monospace;">'+fmtRp(subtotal)+'</span></div>';
  html += '<div class="row-between" style="font-size:13px;color:var(--muted);margin-bottom:10px;"><span>Pajak (10%)</span><span style="font-family:JetBrains Mono,monospace;">'+fmtRp(tax)+'</span></div>';
  html += '<div class="row-between" style="font-size:16px;font-weight:700;margin-bottom:4px;"><span>Total</span><span style="font-family:JetBrains Mono,monospace;">'+fmtRp(total)+'</span></div>';
  html += '<div class="pay-methods">'+payBtns+'</div>';

  var cashInsufficient = false;
  if(k.payMethod==="Tunai"){
    var cashReceived = k.cashReceived==="" ? null : Number(k.cashReceived);
    var kembalian = cashReceived==null ? null : cashReceived - total;
    cashInsufficient = cashReceived==null || kembalian<0;
    html += '<div style="margin:10px 0 2px;">'+
      '<label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;">Uang Tunai Diterima</label>'+
      '<input id="kasir-cash-received" type="text" inputmode="numeric" placeholder="0" value="'+esc(k.cashReceived)+'" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;font-family:JetBrains Mono,monospace;"/>'+
      '<div class="row-between" style="margin-top:8px;font-size:13.5px;font-weight:700;'+(kembalian!=null&&kembalian<0?"color:var(--red);":"color:var(--good);")+'"><span style="font-weight:600;font-size:13px;color:var(--muted);">Kembalian</span><span style="font-family:JetBrains Mono,monospace;">'+(kembalian==null?"—":fmtRp(Math.max(kembalian,0)))+'</span></div>'+
      (kembalian!=null && kembalian<0 ? '<div style="font-size:11px;color:var(--red);margin-top:2px;">Uang tunai kurang '+fmtRp(Math.abs(kembalian))+'</div>' : '')+
      '</div>';
  }

  html += '<button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:6px;" data-pay-now '+(k.cart.length===0||state.busy||cashInsufficient?"disabled":"")+'>'+(state.busy?"Memproses...":"Bayar "+(k.cart.length>0?fmtRp(total):""))+'</button>';
  if(state.lastReceipt){
    html += '<button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:8px;" data-print-last>Cetak Nota Terakhir</button>';
  }
  html += '</div></div>';
  html += '</div>';

  if(state.toast){
    html += '<div class="toast">'+ICONS.check(16)+' '+esc(state.toast)+'</div>';
  }
  return html;
}

function categoryName(catId){
  var c = state.categories.filter(function(x){ return x.id===catId; })[0];
  return c ? c.name : "Lainnya";
}

function addToCart(id){
  var p = state.products.filter(function(x){ return x.id===id; })[0];
  if(!p || (p.stock||0)<=0) return;
  var found = state.kasir.cart.filter(function(i){ return i.id===id; })[0];
  if(found){ found.qty += 1; }
  else { state.kasir.cart.push({ id:p.id, name:p.name, price:Number(p.price), qty:1, image_url:p.image_url||null }); }
  renderApp();
}
function changeQty(id, delta){
  state.kasir.cart = state.kasir.cart.map(function(i){
    if(i.id!==id) return i;
    return Object.assign({}, i, {qty: Math.max(0, i.qty+delta)});
  }).filter(function(i){ return i.qty>0; });
  renderApp();
}
function removeCartItem(id){
  state.kasir.cart = state.kasir.cart.filter(function(i){ return i.id!==id; });
  renderApp();
}

async function handlePay(){
  var k = state.kasir;
  if(k.cart.length===0 || state.busy) return;
  state.busy = true; renderApp();

  var subtotal = k.cart.reduce(function(s,i){ return s+i.price*i.qty; }, 0);
  var tax = Math.round(subtotal*0.10);
  var total = subtotal + tax;
  var cashReceived = k.payMethod==="Tunai" ? (Number(k.cashReceived)||0) : null;
  var changeAmount = cashReceived!=null ? (cashReceived - total) : null;

  try{
    var { data: order, error: orderErr } = await sb.from("orders").insert({
      outlet_id: state.profile.outlet_id,
      table_id: k.orderType==="dinein" ? (k.selectedMeja || null) : null,
      order_type: k.orderType,
      customer_name: k.customerName ? k.customerName.trim() : null,
      source: "kasir",
      status: "selesai",
      subtotal: subtotal, tax: tax, total: total,
      created_by: state.profile.id
    }).select().single();
    if(orderErr) throw orderErr;

    var items = k.cart.map(function(i){
      return { order_id: order.id, product_id: i.id, qty: i.qty, price: i.price };
    });
    var { error: itemsErr } = await sb.from("order_items").insert(items);
    if(itemsErr) throw itemsErr;

    var { error: payErr } = await sb.from("payments").insert({
      order_id: order.id, method: k.payMethod.toLowerCase(), amount: total,
      cash_received: cashReceived, change_amount: changeAmount
    });
    if(payErr) throw payErr;

    if(k.orderType==="dinein" && k.selectedMeja){
      await sb.from("tables").update({ status:"terisi" }).eq("id", k.selectedMeja);
      state.tables = state.tables.map(function(t){
        return String(t.id)===String(k.selectedMeja) ? Object.assign({}, t, { status:"terisi" }) : t;
      });
    }

    var stockUpdates = k.cart.map(function(i){
      return sb.rpc("decrement_stock", { p_product_id: i.id, p_qty: i.qty });
    });
    await Promise.all(stockUpdates);
    state.products = state.products.map(function(p){
      var cartItem = k.cart.filter(function(i){ return i.id===p.id; })[0];
      if(!cartItem) return p;
      return Object.assign({}, p, { stock: Math.max(0, (p.stock||0) - cartItem.qty) });
    });

    var mejaLabel = null;
    if(k.orderType==="dinein" && k.selectedMeja){
      var tb = state.tables.filter(function(x){ return String(x.id)===String(k.selectedMeja); })[0];
      mejaLabel = tb ? tb.label : null;
    }
    state.lastReceipt = {
      items: k.cart.map(function(i){ return { name:i.name, qty:i.qty, price:i.price }; }),
      meta: { mejaLabel:mejaLabel, method:k.payMethod, subtotal:subtotal, tax:tax, total:total, customerName:k.customerName||null, cashReceived:cashReceived, changeAmount:changeAmount }
    };

    state.toast = "Pembayaran "+fmtRp(total)+" via "+k.payMethod+" berhasil";
    k.cart = [];
    k.cashReceived = "";
    k.customerName = "";
    k.orderType = "takeaway";
    k.selectedMeja = "";
    k.payMethod = "QRIS";
    refreshDashboardStats().then(renderApp);
    var dp = state.dashboardPeriod;
    if(dp.filterType==="harian" && dp.date===localISODate()){ dp.loaded = false; loadDashboardPeriod(); }

    if(state.printer.connected){
      try{
        await sendToPrinter(await buildReceiptBytes(state.lastReceipt.items, state.lastReceipt.meta));
        state.toast += " • Nota tercetak";
      }catch(printErr){
        state.toast += " • Gagal cetak nota otomatis";
      }
    }
  }catch(err){
    state.toast = "Gagal menyimpan transaksi: "+(err.message||err);
  }
  state.busy = false;
  renderApp();
  setTimeout(function(){ state.toast = null; renderApp(); }, 3200);
}

/* ---------- Riwayat Transaksi ---------- */
async function loadRiwayat(){
  if(!state.profile) return;
  var r = state.riwayat;
  r.loading = true; r.error = null; renderApp();

  var start, end;
  if(r.filterType === "harian"){
    start = new Date(r.date+"T00:00:00");
    end = new Date(start); end.setDate(end.getDate()+1);
  } else if(r.filterType === "bulanan"){
    var parts = r.month.split("-");
    start = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    end = new Date(Number(parts[0]), Number(parts[1]), 1);
  } else {
    start = new Date(Number(r.year), 0, 1);
    end = new Date(Number(r.year)+1, 0, 1);
  }

  var { data, error } = await sb.from("orders")
    .select("id,total,subtotal,tax,status,created_at,table_id,tables(label),order_items(qty,price,products(name)),payments(method,amount)")
    .eq("outlet_id", state.profile.outlet_id)
    .gte("created_at", start.toISOString())
    .lt("created_at", end.toISOString())
    .order("created_at", { ascending:false });

  r.loading = false;
  if(error){ r.error = error.message; renderApp(); return; }
  r.orders = data || [];
  r.loaded = true;
  renderApp();
}

function laporanSummary(){
  var r = state.laporan;
  var valid = r.orders.filter(function(o){ return o.status==="selesai"; });
  var totalSales = valid.reduce(function(s,o){ return s+Number(o.total||0); }, 0);
  var transCount = valid.length;
  var avg = transCount>0 ? Math.round(totalSales/transCount) : 0;

  var byMethod = {};
  valid.forEach(function(o){
    var m = (o.payments && o.payments[0]) ? o.payments[0].method : "lainnya";
    byMethod[m] = byMethod[m] || { count:0, total:0 };
    byMethod[m].count++; byMethod[m].total += Number(o.total||0);
  });

  var byType = { takeaway:{count:0,total:0}, dinein:{count:0,total:0} };
  valid.forEach(function(o){
    var t = o.order_type==="dinein" ? "dinein" : "takeaway";
    byType[t].count++; byType[t].total += Number(o.total||0);
  });

  var productMap = {};
  valid.forEach(function(o){
    (o.order_items||[]).forEach(function(it){
      var name = it.products ? it.products.name : "Produk";
      productMap[name] = productMap[name] || { qty:0, revenue:0 };
      productMap[name].qty += it.qty;
      productMap[name].revenue += it.qty * Number(it.price||0);
    });
  });
  var topProducts = Object.keys(productMap).map(function(name){
    return { name:name, qty:productMap[name].qty, revenue:productMap[name].revenue };
  }).sort(function(a,b){ return b.qty-a.qty; }).slice(0,5);

  return { totalSales:totalSales, transCount:transCount, avg:avg, byMethod:byMethod, byType:byType, topProducts:topProducts };
}

function laporanPeriodLabel(){
  var r = state.laporan;
  if(r.filterType==="harian"){
    return new Date(r.date+"T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  }
  var parts = r.month.split("-");
  return new Date(Number(parts[0]), Number(parts[1])-1, 1).toLocaleDateString("id-ID", {month:"long", year:"numeric"});
}

async function buildLaporanReceiptBytes(){
  var W = state.printer.paperWidth || 32;
  var rs = getReceiptSettings();
  var s = laporanSummary();
  var lines = [];
  lines.push(centerLine((state.outlet && state.outlet.name) || "POSIVO", W));
  lines.push(centerLine("LAPORAN PENJUALAN", W));
  lines.push(centerLine(laporanPeriodLabel(), W));
  lines.push("-".repeat(W));
  lines.push(padRight("Dicetak", W-new Date().toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"}).length)+new Date().toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"}));
  lines.push(padRight("Oleh", W-((state.profile&&state.profile.full_name)||"-").length)+((state.profile&&state.profile.full_name)||"-"));
  lines.push("-".repeat(W));
  lines.push(padRight("Total Penjualan", W-moneyShort(s.totalSales).length)+moneyShort(s.totalSales));
  lines.push(padRight("Jumlah Transaksi", W-String(s.transCount).length)+String(s.transCount));
  lines.push(padRight("Rata-rata/Transaksi", W-moneyShort(s.avg).length)+moneyShort(s.avg));
  lines.push("-".repeat(W));
  lines.push("METODE PEMBAYARAN");
  Object.keys(s.byMethod).forEach(function(m){
    var v = s.byMethod[m];
    var label = m.charAt(0).toUpperCase()+m.slice(1)+" ("+v.count+"x)";
    lines.push(padRight(label, W-moneyShort(v.total).length)+moneyShort(v.total));
  });
  lines.push("-".repeat(W));
  lines.push("TAKE AWAY VS DINE IN");
  lines.push(padRight("Take Away ("+s.byType.takeaway.count+"x)", W-moneyShort(s.byType.takeaway.total).length)+moneyShort(s.byType.takeaway.total));
  lines.push(padRight("Dine In ("+s.byType.dinein.count+"x)", W-moneyShort(s.byType.dinein.total).length)+moneyShort(s.byType.dinein.total));
  lines.push("-".repeat(W));
  lines.push("PRODUK TERLARIS");
  s.topProducts.forEach(function(p){
    lines.push(asciiSafe(p.name));
    lines.push(padRight(p.qty+" pcs", W-moneyShort(p.revenue).length)+moneyShort(p.revenue));
  });
  lines.push("-".repeat(W));
  lines.push(centerLine("- Powered by Posivo -", W));
  lines.push(""); lines.push(""); lines.push("");

  var bytes = new TextEncoder().encode(lines.join("\n") + "\n");
  var out = new Uint8Array(bytes.length + 2);
  out.set(new Uint8Array([0x1B, 0x40]), 0);
  out.set(bytes, 2);
  return out;
}

async function handlePrintLaporan(){
  if(!state.printer.connected){
    alert("Printer belum tersambung. Sambungkan printer dulu di menu Pengaturan.");
    return;
  }
  state.laporan.printBusy = true; renderApp();
  try{
    await sendToPrinter(await buildLaporanReceiptBytes());
    state.toast = "Laporan berhasil dicetak";
  }catch(err){
    state.toast = "Gagal mencetak laporan: " + (err.message||err);
  }
  state.laporan.printBusy = false;
  renderApp();
  setTimeout(function(){ state.toast = null; renderApp(); }, 3200);
}

function handleDownloadLaporanPDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("Modul PDF belum siap, coba lagi sebentar.");

    doc.text(outletName, 15, y); y += 7;
    doc.setFontSize(12); doc.text("Laporan Penjualan — " + laporanPeriodLabel(), 15, y); y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(120);
    doc.text("Dicetak " + new Date().toLocaleString("id-ID",{dateStyle:"long",timeStyle:"short"}) + " oleh " + ((state.profile&&state.profile.full_name)||"-"), 15, y); y += 10;

    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Ringkasan", 15, y); y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(10);

    doc.text("Jumlah Transaksi: " + s.transCount, 15, y); y += 6;
    doc.text("Rata-rata / Transaksi: " + fmtRp(s.avg), 15, y); y += 10;

    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Metode Pembayaran", 15, y); y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    Object.keys(s.byMethod).forEach(function(m){
      var v = s.byMethod[m];
      doc.text(m.charAt(0).toUpperCase()+m.slice(1) + " (" + v.count + "x): " + fmtRp(v.total), 15, y); y += 6;
    });
    y += 4;

    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Take Away vs Dine In", 15, y); y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.text("Take Away (" + s.byType.takeaway.count + "x): " + fmtRp(s.byType.takeaway.total), 15, y); y += 6;
    doc.text("Dine In (" + s.byType.dinein.count + "x): " + fmtRp(s.byType.dinein.total), 15, y); y += 10;

    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Produk Terlaris", 15, y); y += 7;
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text("Produk", 15, y); doc.text("Qty", 130, y); doc.text("Omzet", 155, y); y += 5;
    doc.setDrawColor(200); doc.line(15, y, 195, y); y += 5;
    doc.setFont("helvetica","normal");
    if(s.topProducts.length===0){
      doc.text("Belum ada produk terjual pada periode ini.", 15, y); y += 6;
    } else {
      s.topProducts.forEach(function(p){
        doc.text(String(p.name), 15, y);
        doc.text(String(p.qty), 130, y);
        doc.text(fmtRp(p.revenue), 155, y);
        y += 6;
      });
    }

    var fname = "laporan-" + outletName.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-" + (state.laporan.filterType==="harian"?state.laporan.date:state.laporan.month) + ".pdf";
    doc.save(fname);
  }catch(err){
    alert("Gagal membuat PDF: " + (err.message||err));
  }
  state.laporan.pdfBusy = false;
  renderApp();
}

async function handleSaveMeja(){

  var f = m.form;
  if(!f.label.trim()){
    m.formError = "No. Meja wajib diisi.";
    renderApp(); return;
  }
  m.busy = true; m.formError = null; renderApp();
  var { data, error } = await sb.from("tables").insert({
    outlet_id: state.profile.outlet_id,
    label: f.label.trim(),
    area: f.area,
    capacity: f.capacity ? Number(f.capacity) : null,

  var { error } = await sb.from("tables").delete().eq("id", id);

async function handleMejaClick(id){

  if(!t) return;
  if(t.status==="reserved"){ state.meja.activeModal = id; renderApp(); return; }
  var idx = CYCLE.indexOf(t.status);
  var next = CYCLE[(idx+1)%CYCLE.length];
  t.status = next; renderApp();
  await sb.from("tables").update({ status: next }).eq("id", id);
}

async function setMejaStatus(id, status){
  var t = state.tables.filter(function(x){ return x.id===id; })[0];

  state.meja.activeModal = null; renderApp();
  await sb.from("tables").update({ status: status }).eq("id", id);
}

  var m = state.produkModal;
  var name = document.getElementById("produk-modal-name").value.trim();
  var price = Number(document.getElementById("produk-modal-price").value);
  var stock = Number(document.getElementById("produk-modal-stock").value) || 0;
  var categoryInput = document.getElementById("produk-modal-category").value.trim();

  if(!name || !price || isNaN(price)){
    m.error = "Nama produk dan harga wajib diisi dengan benar.";
    renderApp(); return;
  }

  m.busy = true; m.error = null; renderApp();

  try{
    var imageUrl = m.existingImageUrl || null;
    if(m.imageFile){
      var outletId = state.profile.outlet_id;
      var safeName = m.imageFile.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
      var filePath = outletId + "/" + Date.now() + "-" + safeName;
      var { error: upErr } = await sb.storage.from("product-images").upload(filePath, m.imageFile, { upsert:true });
      if(upErr) throw upErr;
      var pub = sb.storage.from("product-images").getPublicUrl(filePath);
      imageUrl = pub.data.publicUrl;
    }

    var categoryId = null;
    if(categoryInput){ categoryId = await findOrCreateCategory(categoryInput); }

    var payload = { name:name, price:price, stock:stock, image_url:imageUrl, category_id:categoryId, is_active:true };

    if(m.mode==="edit"){
      var { error: updErr } = await sb.from("products").update(payload).eq("id", m.id);
      if(updErr) throw updErr;
    } else {
      payload.outlet_id = state.profile.outlet_id;
      var { error: insErr } = await sb.from("products").insert(payload);
      if(insErr) throw insErr;
    }

    state.produkModal.open = false;
    await refreshAll();
    renderApp();
  }catch(err){
    m.error = "Gagal menyimpan: "+(err.message||err);
    m.busy = false;
    renderApp();
  }
}

async function edgeFunctionErrorMessage(error){
  if(!error) return null;
  try{
    if(error.context && typeof error.context.json === "function"){
      var body = await error.context.clone().json();
      if(body && body.error) return body.error;
    }
  }catch(e){}
  return error.message || "Terjadi kesalahan.";
}

async function handleSaveKasir(){
  var km = state.kasirManager;
  var f = km.form;
  if(km.mode==="add"){
    if(!f.fullName.trim() || !f.email.trim() || !f.password || f.password.length<6){
      km.formError = "Nama, email, dan password (min. 6 karakter) wajib diisi.";
      renderApp(); return;
    }
    if(km.list.length >= kasirSlotLimit()){
      km.formError = "Batas akun kasir tercapai. Tambah slot dulu di bawah.";
      renderApp(); return;
    }
    km.busy = true; km.formError = null; renderApp();
    var { data, error } = await sb.functions.invoke("create-kasir", {
      body: { fullName: f.fullName.trim(), email: f.email.trim(), password: f.password, outlet_id: state.profile.outlet_id }
    });
    km.busy = false;
    if(error || (data && data.error)){
      km.formError = (data && data.error) || await edgeFunctionErrorMessage(error) || "Gagal membuat akun kasir.";
      renderApp(); return;
    }
    km.modalOpen = false;
    await loadKasirList();
  } else {
    if(!f.fullName.trim()){ km.formError = "Nama wajib diisi."; renderApp(); return; }
    km.busy = true; km.formError = null; renderApp();
    var { error: upErr } = await sb.from("profiles").update({ full_name: f.fullName.trim() }).eq("id", km.editId);
    km.busy = false;
    if(upErr){ km.formError = upErr.message; renderApp(); return; }
    if(f.password){
      var { data: pwData, error: pwErr } = await sb.functions.invoke("reset-kasir-password", {
        body: { id: km.editId, password: f.password }
      });
      if(pwErr || (pwData && pwData.error)){
        km.formError = (pwData && pwData.error) || await edgeFunctionErrorMessage(pwErr) || "Nama tersimpan, tapi gagal reset password.";
        renderApp(); return;
      }
    }
    km.modalOpen = false;
    await loadKasirList();
  }
}

async function deleteKasir(id){
  if(!window.confirm("Hapus akun kasir ini? Login-nya akan langsung dinonaktifkan.")) return;
  var { data, error } = await sb.functions.invoke("delete-kasir", { body: { id: id } });
  if(error || (data && data.error)){
    alert("Gagal menghapus: " + ((data && data.error) || await edgeFunctionErrorMessage(error)));
    return;
  }
  await loadKasirList();
}

    html += '<div style="background:var(--bad-bg);color:var(--red);font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:14px;">'+esc(p.error)+'</div>';
  }

  html += '<div style="display:flex;gap:10px;margin-bottom:22px;">';
  if(!p.connected){
    html += '<button class="btn btn-primary" data-connect-printer '+(p.busy?"disabled":"")+'>'+(p.busy?"Menghubungkan...":"Hubungkan Printer")+'</button>';
  } else {
    html += '<button class="btn btn-outline" data-test-print>Tes Cetak</button>';
    html += '<button class="btn btn-outline" style="color:var(--red);" data-disconnect-printer>Putuskan</button>';
  }
  html += '</div>';

  html += '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:8px;">Lebar Kertas</label>';
  html += '<div style="display:flex;gap:8px;margin-bottom:8px;">';
  [[32,"58mm"], [48,"80mm"]].forEach(function(opt){
    var active = p.paperWidth===opt[0];
    html += '<button class="cat-tab'+(active?" active":"")+'" data-paper-width="'+opt[0]+'">'+opt[1]+'</button>';
  });
  html += '</div>';
  html += '<div style="font-size:11.5px;color:var(--muted);">Kompatibel dengan printer thermal Bluetooth Low Energy (BLE) generik yang umum dijual sebagai "printer kasir portable 58mm/80mm". Butuh Chrome/Edge di Android atau Desktop — Web Bluetooth tidak didukung Safari/iOS.</div>';
  html += '</div>';

  html += '<div class="card" style="padding:22px;max-width:820px;">';
  html += '<div class="section-title" style="margin-bottom:4px;">Tampilan Nota</div>';
  html += '<div style="font-size:12.5px;color:var(--muted);margin-bottom:18px;">Atur logo, info di bawah logo (alamat/akun sosial media), dan pesan footer yang tercetak di setiap nota. Perubahan langsung terlihat di pratinjau, dan ikut tercetak ke printer setelah disimpan.</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 260px;gap:26px;align-items:start;">';

  html += '<div>';
  html += '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">Logo / Brand</label>';
  html += '<input id="receipt-logo-file" type="file" accept="image/*" style="width:100%;font-size:12px;margin-bottom:14px;"/>';
  html += '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">Info di Bawah Logo</label>';
  html += '<textarea id="receipt-header-text" rows="3" style="width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:14px;resize:vertical;font-family:inherit;" placeholder="Contoh: Jl. Melati No. 12, Jakarta&#10;IG: @kopisenja &middot; WA: 0812-xxxx-xxxx">'+esc(re.headerText)+'</textarea>';
  html += '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">Footer Nota</label>';
  html += '<textarea id="receipt-footer-text" rows="3" style="width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:14px;resize:vertical;font-family:inherit;" placeholder="Contoh: Alamat lengkap outlet, atau promo kunjungan berikutnya seperti diskon 10% dengan menunjukkan struk ini.">'+esc(re.footerText)+'</textarea>';
  if(re.error){ html += '<div style="background:var(--bad-bg);color:var(--red);font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:12px;">'+esc(re.error)+'</div>'; }
  if(re.saved){ html += '<div style="background:var(--good-bg);color:var(--good);font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:12px;">Tersimpan.</div>'; }
  html += '<button class="btn btn-primary" data-save-receipt-settings '+(re.busy?"disabled":"")+'>'+(re.busy?"Menyimpan...":"Simpan Perubahan")+'</button>';
  html += '</div>';

  html += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:8px;text-align:center;">PRATINJAU</div>'+renderReceiptPreviewHTML()+'</div>';

  html += '</div></div>';
  return html;
}

async function deleteProduct(id){
  if(!window.confirm("Hapus produk ini?")) return;
  await sb.from("products").delete().eq("id", id);
  await refreshAll();
  renderApp();
}

/* ---------- Root render ---------- */
function renderApp(){
  if(state.stage==="loading"){
    root.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;">Memuat Posivo...</div>';
    return;
  }
  if(state.stage==="login"){
    root.innerHTML = renderLogin();
    var f = document.getElementById("login-form");
    if(f) f.addEventListener("submit", handleLoginSubmit);
    var sf = document.getElementById("signup-form");
    if(sf) sf.addEventListener("submit", handleSignupSubmit);
    return;
  }
  if(state.stage==="no-outlet"){
    root.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;">'+
      '<div class="card" style="max-width:480px;padding:26px;text-align:center;">'+
      '<div class="section-title" style="margin-bottom:8px;">Akun belum terhubung ke outlet</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Akun kamu berhasil login, tapi belum ditautkan ke data outlet manapun di tabel <code>profiles</code>. Hubungkan dulu lewat Supabase SQL Editor, lalu klik Coba Lagi.</div>'+
      (state.debugInfo ? '<pre style="text-align:left;font-size:10.5px;background:#F6F3EF;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:14px;white-space:pre-wrap;word-break:break-all;color:var(--muted);">'+esc(state.debugInfo)+'</pre>' : '')+
      '<button class="btn btn-primary" data-retry style="width:100%;justify-content:center;margin-bottom:10px;">Coba Lagi</button>'+
      '<button class="btn btn-outline" data-logout style="width:100%;justify-content:center;">Keluar</button></div></div>';
    return;
  }
  if(state.stage==="trial-expired"){
    root.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;">'+
      '<div class="card" style="max-width:420px;padding:30px;text-align:center;">'+
      '<div style="width:52px;height:52px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">'+ICONS.table(24)+'</div>'+
      '<div class="section-title" style="margin-bottom:8px;font-size:17px;">Masa trial kamu sudah berakhir</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-bottom:20px;">Trial 14 hari untuk <b style="color:var(--ink);">'+esc((state.outlet&&state.outlet.name)||"outlet kamu")+'</b> sudah habis. Lanjutkan berlangganan Rp49.000/bulan untuk terus pakai Posivo.</div>'+
      '<button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-bottom:10px;" onclick="alert(\'Halaman pembayaran langganan segera hadir. Hubungi kami untuk aktivasi manual sementara.\')">Berlangganan Sekarang</button>'+
      '<button class="btn btn-outline" data-logout style="width:100%;justify-content:center;">Keluar</button></div></div>';
    return;
  }

  var content;
  if(isKasir() && state.view==="pengaturan"){ state.view = "dashboard"; }
  if(state.view==="dashboard") content = renderDashboard();
  else if(state.view==="kasir") content = renderKasir();
  else if(state.view==="riwayat") content = renderRiwayat();
  else if(state.view==="meja") content = renderMeja();
  else if(state.view==="produk") content = renderProduk();
  else if(state.view==="laporan") content = renderLaporan();
  else if(state.view==="pengaturan") content = renderPengaturan();
  else content = renderDashboard();

  root.innerHTML = '<div class="app-shell">'+renderSidebar()+
    '<div style="flex:1;display:flex;flex-direction:column;min-width:0;">'+
    renderTopbar()+
    '<div class="content-scroll"><div class="content-pad">'+content+'</div></div>'+
    '</div></div>';

  if(state._focusSearch){
    var inp = document.getElementById("produk-search");
    if(inp){ inp.focus(); var c = state.produk.cursor||0; inp.setSelectionRange(c,c); }
  }
  if(state._focusField){
    var fEl = document.getElementById(state._focusField.id);
    if(fEl){ fEl.focus(); var fc = state._focusField.cursor||0; fEl.setSelectionRange(fc,fc); }
    state._focusField = null;
  }
}

/* ---------- Event delegation ---------- */
/* Sliding nav highlight: glides smoothly to whichever menu item is hovered */
root.addEventListener("mouseover", function(e){
  var item = e.target.closest(".sidebar .nav-item");
  if(!item) return;
  var sidebarEl = item.closest(".sidebar");
  var hl = sidebarEl.querySelector("#navHighlight");
  if(!hl) return;
  var sRect = sidebarEl.getBoundingClientRect();
  var iRect = item.getBoundingClientRect();
  hl.style.top = (iRect.top - sRect.top) + "px";
  hl.style.left = (iRect.left - sRect.left) + "px";
  hl.style.width = iRect.width + "px";
  hl.style.height = iRect.height + "px";
  hl.classList.add("is-visible");
});
root.addEventListener("mouseout", function(e){
  var item = e.target.closest(".sidebar .nav-item");
  if(!item) return;
  var toItem = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest(".sidebar .nav-item") : null;
  if(toItem) return; // moving straight to another nav-item — let its mouseover keep the bar visible/sliding
  var hl = item.closest(".sidebar").querySelector("#navHighlight");
  if(hl) hl.classList.remove("is-visible");
});

root.addEventListener("click", function(e){
  var sidebarToggle = e.target.closest("[data-sidebar-toggle]");
  if(sidebarToggle){ state.sidebarPinned = !state.sidebarPinned; renderApp(); return; }

  var logoutBtn = e.target.closest("[data-logout]");
  if(logoutBtn){ sb.auth.signOut(); return; }

  var retryBtn = e.target.closest("[data-retry]");
  if(retryBtn){ loadData(); return; }

  var authModeBtn = e.target.closest("[data-auth-mode]");
  if(authModeBtn){ state.authMode = authModeBtn.getAttribute("data-auth-mode"); state.authError = null; state.authInfo = null; renderApp(); return; }

  var navBtn = e.target.closest("[data-nav]");
  if(navBtn){
    state.view = navBtn.getAttribute("data-nav");
    renderApp();
    if(state.view==="riwayat") loadRiwayat();
    return;
  }

  var riwayatFilterBtn = e.target.closest("[data-riwayat-filter]");
  if(riwayatFilterBtn){
    state.riwayat.filterType = riwayatFilterBtn.getAttribute("data-riwayat-filter");
    renderApp();
    loadRiwayat();
    return;
  }

  var laporanFilterBtn = e.target.closest("[data-laporan-filter]");
  if(laporanFilterBtn){
    state.laporan.filterType = laporanFilterBtn.getAttribute("data-laporan-filter");
    state.laporan.loaded = false;
    renderApp();
    loadLaporan();
    return;
  }

  var dashFilterBtn = e.target.closest("[data-dash-filter]");
  if(dashFilterBtn){
    state.dashboardPeriod.filterType = dashFilterBtn.getAttribute("data-dash-filter");
    state.dashboardPeriod.loaded = false;
    renderApp();
    loadDashboardPeriod();
    return;
  }

  var laporanPrintBtn = e.target.closest("[data-laporan-print]");
  if(laporanPrintBtn && !laporanPrintBtn.disabled){ handlePrintLaporan(); return; }

  var laporanPdfBtn = e.target.closest("[data-laporan-pdf]");
  if(laporanPdfBtn && !laporanPdfBtn.disabled){ handleDownloadLaporanPDF(); return; }

  var catTab = e.target.closest("[data-kasir-cat]");
  if(catTab){ state.kasir.cat = catTab.getAttribute("data-kasir-cat"); renderApp(); return; }

  var addBtn = e.target.closest("[data-add-product]");
  if(addBtn){ addToCart(addBtn.getAttribute("data-add-product")); return; }

  var qtyBtn = e.target.closest("[data-qty-id]");
  if(qtyBtn){ changeQty(qtyBtn.getAttribute("data-qty-id"), Number(qtyBtn.getAttribute("data-qty-delta"))); return; }

  var removeBtn = e.target.closest("[data-remove]");
  if(removeBtn){ removeCartItem(removeBtn.getAttribute("data-remove")); return; }

  var payMethodBtn = e.target.closest("[data-pay-method]");
  if(payMethodBtn){ state.kasir.payMethod = payMethodBtn.getAttribute("data-pay-method"); renderApp(); return; }

  var payNowBtn = e.target.closest("[data-pay-now]");
  if(payNowBtn && !payNowBtn.disabled){ handlePay(); return; }

  var printLastBtn = e.target.closest("[data-print-last]");
  if(printLastBtn){ printLastReceipt(); return; }

  var connectPrinterBtn = e.target.closest("[data-connect-printer]");
  if(connectPrinterBtn && !connectPrinterBtn.disabled){ connectPrinter(); return; }

  var disconnectPrinterBtn = e.target.closest("[data-disconnect-printer]");
  if(disconnectPrinterBtn){ disconnectPrinter(); return; }

  var testPrintBtn = e.target.closest("[data-test-print]");
  if(testPrintBtn){ testPrint(); return; }

  var paperWidthBtn = e.target.closest("[data-paper-width]");
  if(paperWidthBtn){ state.printer.paperWidth = Number(paperWidthBtn.getAttribute("data-paper-width")); renderApp(); return; }

  var saveReceiptBtn = e.target.closest("[data-save-receipt-settings]");
  if(saveReceiptBtn && !saveReceiptBtn.disabled){ handleSaveReceiptSettings(); return; }

  var saveProfileBtn = e.target.closest("[data-save-profile-settings]");
  if(saveProfileBtn && !saveProfileBtn.disabled){ handleSaveProfileSettings(); return; }

  var addMejaBtn = e.target.closest("[data-add-meja]");
  if(addMejaBtn){ openAddMejaModal(); return; }

  var closeMejaFormBtn = e.target.closest("[data-close-meja-form]");
  if(closeMejaFormBtn){ closeMejaFormModal(); return; }

  var saveMejaFormBtn = e.target.closest("[data-save-meja-form]");
  if(saveMejaFormBtn && !saveMejaFormBtn.disabled){ handleSaveMeja(); return; }

  if(e.target.hasAttribute && e.target.hasAttribute("data-modal-backdrop-meja")){
    closeMejaFormModal(); return;
  }

  var deleteMejaBtn = e.target.closest("[data-delete-meja]");
  if(deleteMejaBtn){ handleDeleteMeja(deleteMejaBtn.getAttribute("data-delete-meja")); return; }

  var mejaCard = e.target.closest("[data-meja-id]");
  if(mejaCard){ handleMejaClick(mejaCard.getAttribute("data-meja-id")); return; }

  var modalDatang = e.target.closest("[data-modal-datang]");
  if(modalDatang){ setMejaStatus(modalDatang.getAttribute("data-modal-datang"), "terisi"); return; }
  var modalBatal = e.target.closest("[data-modal-batal]");
  if(modalBatal){ setMejaStatus(modalBatal.getAttribute("data-modal-batal"), "kosong"); return; }
  var modalClose = e.target.closest("[data-modal-close]");
  if(modalClose){ state.meja.activeModal = null; renderApp(); return; }
  if(e.target.hasAttribute && e.target.hasAttribute("data-modal-backdrop")){
    state.meja.activeModal = null; renderApp(); return;
  }

  var addProdukBtn = e.target.closest("[data-add-produk]");
  if(addProdukBtn){ openAddProductModal(); return; }

  var editProdukBtn = e.target.closest("[data-edit-produk]");
  if(editProdukBtn){ openEditProductModal(editProdukBtn.getAttribute("data-edit-produk")); return; }

  var delProdukBtn = e.target.closest("[data-delete-produk]");
  if(delProdukBtn){ deleteProduct(delProdukBtn.getAttribute("data-delete-produk")); return; }

  var closeProdukModalBtn = e.target.closest("[data-close-produk-modal]");
  if(closeProdukModalBtn){ closeProductModal(); return; }

  var saveProdukModalBtn = e.target.closest("[data-save-produk-modal]");
  if(saveProdukModalBtn && !saveProdukModalBtn.disabled){ handleSaveProduct(); return; }

  if(e.target.hasAttribute && e.target.hasAttribute("data-modal-backdrop-produk")){
    closeProductModal(); return;
  }

  var addKasirBtn = e.target.closest("[data-add-kasir]");
  if(addKasirBtn){ openAddKasirModal(); return; }

  var editKasirBtn = e.target.closest("[data-edit-kasir]");
  if(editKasirBtn){ openEditKasirModal(editKasirBtn.getAttribute("data-edit-kasir")); return; }

  var delKasirBtn = e.target.closest("[data-delete-kasir]");
  if(delKasirBtn){ deleteKasir(delKasirBtn.getAttribute("data-delete-kasir")); return; }

  var closeKasirModalBtn = e.target.closest("[data-close-kasir-modal]");
  if(closeKasirModalBtn){ closeKasirModal(); return; }

  var saveKasirModalBtn = e.target.closest("[data-save-kasir-modal]");
  if(saveKasirModalBtn && !saveKasirModalBtn.disabled){ handleSaveKasir(); return; }

  if(e.target.hasAttribute && e.target.hasAttribute("data-modal-backdrop-kasir")){
    closeKasirModal(); return;
  }

  var upgradeKasirBtn = e.target.closest("[data-upgrade-kasir-info]");
  if(upgradeKasirBtn){ state.kasirManager.upgradeInfoOpen = !state.kasirManager.upgradeInfoOpen; renderApp(); return; }
});

root.addEventListener("change", function(e){
  if(e.target.id === "kasir-meja-select"){ state.kasir.selectedMeja = e.target.value; }
  if(e.target.id === "kasir-order-type"){
    state.kasir.orderType = e.target.value;
    if(state.kasir.orderType==="takeaway") state.kasir.selectedMeja = "";
    renderApp();
  }
  if(e.target.id === "meja-form-area"){ state.meja.form.area = e.target.value; }
  if(e.target.id === "produk-cat-select"){ state.produk.cat = e.target.value; renderApp(); }
  if(e.target.id === "produk-modal-file"){ handleProductFileChange(e); }
  if(e.target.id === "receipt-logo-file"){ handleReceiptLogoFileChange(e); }
  if(e.target.id === "profile-picture-file"){ handleProfilePictureFileChange(e); }
  if(e.target.id === "riwayat-date-input"){ state.riwayat.date = e.target.value; loadRiwayat(); }
  if(e.target.id === "riwayat-month-input"){ state.riwayat.month = e.target.value; loadRiwayat(); }
  if(e.target.id === "riwayat-year-input"){ state.riwayat.year = Number(e.target.value); loadRiwayat(); }
  if(e.target.id === "laporan-date-input"){ state.laporan.date = e.target.value; state.laporan.loaded = false; loadLaporan(); }
  if(e.target.id === "laporan-month-input"){ state.laporan.month = e.target.value; state.laporan.loaded = false; loadLaporan(); }
  if(e.target.id === "dash-date-input"){ state.dashboardPeriod.date = e.target.value; state.dashboardPeriod.loaded = false; loadDashboardPeriod(); }
  if(e.target.id === "dash-month-input"){ state.dashboardPeriod.month = e.target.value; state.dashboardPeriod.loaded = false; loadDashboardPeriod(); }
  if(e.target.id === "dash-year-input"){ state.dashboardPeriod.year = Number(e.target.value); state.dashboardPeriod.loaded = false; loadDashboardPeriod(); }
});

root.addEventListener("input", function(e){
  if(e.target.id === "produk-search"){
    state.produk.query = e.target.value;
    state.produk.cursor = e.target.selectionStart;
    state._focusSearch = true;
    renderApp();
    state._focusSearch = false;
  }
  if(e.target.id === "receipt-header-text" || e.target.id === "receipt-footer-text"){
    var field = e.target.id === "receipt-header-text" ? "headerText" : "footerText";
    state.receiptEditor[field] = e.target.value;
    state._focusField = { id: e.target.id, cursor: e.target.selectionStart };
    renderApp();
  }
  if(e.target.id === "kasir-customer-name"){
    state.kasir.customerName = e.target.value;
    state._focusField = { id: e.target.id, cursor: e.target.selectionStart };
    renderApp();
  }
  if(e.target.id === "kasir-cash-received"){
    state.kasir.cashReceived = e.target.value.replace(/[^0-9]/g, "");
    state._focusField = { id: e.target.id, cursor: e.target.selectionStart };
    renderApp();
  }
  if(e.target.id === "kasir-modal-name" || e.target.id === "kasir-modal-email" || e.target.id === "kasir-modal-password"){
    var fmap = { "kasir-modal-name":"fullName", "kasir-modal-email":"email", "kasir-modal-password":"password" };
    state.kasirManager.form[fmap[e.target.id]] = e.target.value;
    state._focusField = { id: e.target.id, cursor: e.target.selectionStart };
    renderApp();
  }
  if(e.target.id === "meja-form-label" || e.target.id === "meja-form-capacity"){
    var mmap = { "meja-form-label":"label", "meja-form-capacity":"capacity" };
    var val = e.target.value;
    if(e.target.id === "meja-form-capacity") val = val.replace(/[^0-9]/g, "");
    state.meja.form[mmap[e.target.id]] = val;
    state._focusField = { id: e.target.id, cursor: e.target.selectionStart };
    renderApp();
  }
});

renderApp();
boot();
